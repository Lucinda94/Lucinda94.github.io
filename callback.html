<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Authorisation code</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f6f4f0;
      color: #1c1917;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    main {
      width: 100%;
      max-width: 28rem;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
    }
    p {
      margin: 0 0 1.25rem;
      line-height: 1.45;
      color: #44403c;
    }
    .code-box {
      width: 100%;
      min-height: 4.5rem;
      margin: 0 0 1rem;
      padding: 1rem;
      border: 1px solid #d6d3d1;
      border-radius: 12px;
      background: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1rem;
      line-height: 1.4;
      word-break: break-all;
      overflow-wrap: anywhere;
      color: #1c1917;
    }
    .code-box:focus {
      outline: 2px solid #1c1917;
      outline-offset: 2px;
    }
    button {
      appearance: none;
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: #1c1917;
      color: #fff;
      font: inherit;
      font-weight: 600;
      font-size: 1.05rem;
      padding: 0.85rem 1rem;
    }
    button:active { opacity: 0.85; }
    button:disabled { background: #a8a29e; }
    .status {
      min-height: 1.5rem;
      margin-top: 0.85rem;
      font-size: 0.95rem;
      color: #44403c;
    }
  </style>
</head>
<body>
  <main>
    <h1>Authorisation code</h1>
    <p id="intro">Copy this code and return to the chat to finish signing in.</p>
    <textarea id="code" class="code-box" readonly rows="3" aria-label="Authorisation code"></textarea>
    <button id="copy" type="button">Copy code</button>
    <p class="status" id="status" role="status"></p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get("code") || "";
      var box = document.getElementById("code");
      var button = document.getElementById("copy");
      var status = document.getElementById("status");
      var intro = document.getElementById("intro");

      box.value = code;

      if (!code) {
        intro.textContent = "No code was found in this link. Go back and try signing in again.";
        button.disabled = true;
        return;
      }

      box.focus();
      box.select();

      function copied() {
        status.textContent = "Copied. You can paste it in the chat now.";
        button.textContent = "Copied";
      }

      function fallbackSelect() {
        box.focus();
        box.select();
        box.setSelectionRange(0, box.value.length);
        status.textContent = "Select the code above, then tap Copy.";
      }

      button.addEventListener("click", function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(copied).catch(function () {
            try {
              fallbackSelect();
              if (document.execCommand("copy")) copied();
            } catch (e) {
              fallbackSelect();
            }
          });
          return;
        }
        try {
          fallbackSelect();
          if (document.execCommand("copy")) copied();
        } catch (e) {
          fallbackSelect();
        }
      });
    })();
  </script>
</body>
</html>
